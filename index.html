<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">

  <title>Frontend Mentor | Stats preview card component</title>

</head>
<body>
  <section class="card">
    <div class="card__wrapper">
      <div class="card__image-wrapper">
        <picture>
          <source type="image/jpeg" media="(min-width: 1440px)" srcset="images/image-header-desktop.jpg">
          <img class="card__image" src="images/image-header-mobile.jpg" alt="">
        </picture>
      </div>

      <div class="card__content">
        <h3 class="card__title">Get <span class="card__title--color">insights</span> that help your business grow.</h3>
        <p class="card__text">Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>

        <ul class="card__stats stats">
          <li class="stats__item">
            <span class="stats__number">10k+</span>
            <span class="stats__text">companies</span>
          </li>

          <li class="stats__item">
            <span class="stats__number">314</span>
            <span class="stats__text">templates</span>
          </li>

          <li class="stats__item">
            <span class="stats__number">12M+</span>
            <span class="stats__text">queries</span>
          </li>

        </ul>
      </div>
    </div>
  </section>

</body>
</html>
